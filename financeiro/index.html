<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <script async src="dash.js"></script>
    <title>Gestão Patrimonial</title>
</head>

<body class="light-mode-variables">


    <div class="container">

        <main>

            <div class="header">


                <h1></h1>

                <a href="editar.html">

                    <span class="material-icons-sharp">
                        edit
                    </span>

                </a>



            </div>

            <!-- -------------------------------------------------------------->

            <div class="analyse">


                <div class="kpi">

                    <h3>Total Pago</h3>
                    <h1 id="valor_pago">R$ 0,00</h1>

                </div>

                <div class="kpi">

                    <h3>Total Devido</h3>
                    <h1 id="valor_devido">R$ 0,00</h1>

                </div>

                <div class="kpi">

                    <h3>Saldo</h3>
                    <h1 id="saldo">R$ 0,00</h1>

                </div>
            </div>


            <div class="charts-container">

                <div class="chart_card">

                    <h3>Pago Versus Devido</h3>

                    <div id="pie" style="width:100%;height:100%;"></div>

                </div>

                <div class="chart_card">

                    <h3>Total Pago</h3>

                    <div id="bar_dev" style="width:100%;height:100%;"></div>


                </div>

                <div class="chart_card">

                    <h3>Total Devido</h3>

                    <div id="bar_pago" style="width:100%;height:100%;"></div>


                </div>





                <div class="chart_card card-tabela">

                    <div id="tabela-movimentacoes" class="tabela-container"></div>

                </div>

            </div>

        </main>

    </div>

</body>


</html>
